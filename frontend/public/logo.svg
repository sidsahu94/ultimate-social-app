<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sv-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#1D4ED8" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="sv-grad-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.9" />
    </linearGradient>
    <filter id="sv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Enclave Canvas -->
  <rect width="512" height="512" rx="128" fill="#04070D" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="#070B14" stroke="url(#sv-grad-main)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Ambient Glow Ribbon -->
  <path
    d="M 160 256 C 160 196, 220 160, 256 256 C 292 352, 352 316, 352 256 C 352 196, 292 160, 256 256 C 220 352, 160 316, 160 256 Z"
    stroke="url(#sv-grad-glow)"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#sv-glow)"
    opacity="0.6"
  />

  <!-- Crisp Core Ribbon Infinity ∞ -->
  <path
    d="M 160 256 C 160 196, 220 160, 256 256 C 292 352, 352 316, 352 256 C 352 196, 292 160, 256 256 C 220 352, 160 316, 160 256 Z"
    stroke="url(#sv-grad-main)"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Star Specular Glint -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" filter="url(#sv-glow)" />
  <circle cx="360" cy="220" r="6" fill="#00F2FE" />
  <circle cx="152" cy="292" r="6" fill="#D4AF37" />
</svg>
